[project]
name = "tft-capture"
version = "0.1.0"
description = "Game-state capture: the League client API and, later, the game window."
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28",
    "pillow>=12",
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.30",
    "winrt-Windows.Media.Ocr>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1; sys_platform == 'win32'",
    "windows-capture>=2.0.1; sys_platform == 'win32'",
    "psutil>=7",
    "websockets>=15",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
