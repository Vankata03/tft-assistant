[project]
name = "tft-data"
version = "0.1.0"
description = "Validated immutable patch data and source adapters."
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12", "tomli-w>=1.2"]

[project.scripts]
tft-data = "tft_data.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
